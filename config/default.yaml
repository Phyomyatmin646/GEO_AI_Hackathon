# Myanmar country-wide crop-suitability dataset configuration.
# All raw physical units are preserved in final outputs; standardise only after
# a spatial/temporal train split has been created.
project:
  name: myanmar_agri_suitability
  country_name: Myanmar
  iso3: MMR
  start_month: "2018-01"
  end_month: "2026-12"
  grid_size_m: 5000
  grid_crs: "EPSG:6933"
  output_dir: "data/output"
  raw_gee_dir: "data/raw/gee"
  chirps_v3_cache_dir: "data/raw/chirps_v3"
  soil_cache_dir: "data/raw/soilgrids"
  observed_labels_path: null

earth_engine:
  project: "gen-lang-client-0956667941"
  drive_folder: "myanmar_agri_geo_exports"
  export_scale_m: 5000
  # Competition/default architecture: export static terrain/water/soil once,
  # then export only time-varying satellite/climate bands for each month.
  feature_set: "split"
  # Fast pilot samples at each stable 5 km equal-area cell centroid. Switch to
  # "cell" only for the more expensive polygon-mean production run.
  sampling_geometry: "centroid"
  include_admin1: false
  tile_size_m: 100000
  reduce_regions_tile_scale: 4
  # Approximate the capped JRC water-distance proxy on a 1 km binary grid,
  # rather than a 50 km search at native 30 m resolution.
  water_distance_scale_m: 1000
  tile_id_property: "tile_id"
  max_pixels: 10000000000000
  include_sentinel1: true
  # Sentinel-2 is cloud-masked with its SCL band in the GEE backend.  No
  # unused cloud-probability threshold is kept here.

sources:
  sentinel2: "COPERNICUS/S2_SR_HARMONIZED"
  sentinel1: "COPERNICUS/S1_GRD"
  # Official CHIRPS v3 daily reanalysis in Earth Engine. Final current-month
  # rainfall is still replaced by the reproducible CHIRPS v3 monthly cache
  # during assembly; the GEE collection also provides the 1991-2020 normal.
  chirps: "UCSB-CHC/CHIRPS/V3/DAILY_RNL"
  chirps_v3_monthly_base_url: "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/monthly/global/tifs"
  era5_land: "ECMWF/ERA5_LAND/DAILY_AGGR"
  srtm: "USGS/SRTMGL1_003"
  jrc_surface_water: "JRC/GSW1_4/GlobalSurfaceWater"
  fao_gaul_level0: "FAO/GAUL/2015/level0"
  fao_gaul_level1: "FAO/GAUL/2015/level1"
  soilgrids_webdav: "https://files.isric.org/soilgrids/latest/data"

soilgrids:
  # Set false to export non-soil GEE features first, then sample cached
  # SoilGrids WebDAV/local GeoTIFF layers during `assemble`.
  use_gee_community_assets: true
  # Supply local clipped GeoTIFF/VRT files or let `prepare-soil` cache VRTs.
  # The pipeline calculates a thickness-weighted 0-30 cm mean from 0-5, 5-15,
  # and 15-30 cm layers where all three are available.
  properties: ["phh2o", "sand", "silt", "clay", "soc", "cec"]
  uncertainty_properties: ["phh2o"]
  depth_intervals_cm: ["0-5", "5-15", "15-30"]
  allow_remote_vrt: true

chirps_v3:
  enabled: true
  # Default to the final, official CHIRPS v3 product rather than silently
  # retaining the GEE CHIRPS v2 staging field. Run `prepare-chirps --download`
  # before `assemble`.
  require_complete_cache: false
  download_timeout_seconds: 120

# Historical climate context is separate from target-month weather. These
# normals/anomalies are not forecasts, future scenarios, or causal
# climate-change attribution.
climate_context:
  enabled: false
  baseline_start_year: 1991
  baseline_end_year: 2020

# CollabHub is a mixed resource catalog, not an additional observation source.
# `resource-audit` writes metadata-only CSVs; any external layer remains
# pending until its license, coverage, units, dates, and join contract pass QA.
resource_audit:
  catalog_url: "https://geoai-collabhub.com/resources"
  audit_date: "2026-07-27"
  external_raw_dir: "data/raw/external"
  external_processed_dir: "data/processed/external"

labels:
  suitability_threshold: 70
  default_rule_confidence: 0.45
  observed_label_confidence: 0.85
  calibration_weight: 0.35
  crops:
    - monsoon_rice
    - dry_season_rice
    - maize
    - sugarcane
    - cassava
    - durian
    - mangosteen
    - longan
    - mango
    - chili
    - tomato

quality:
  min_valid_s2_observations: 1
  max_missing_feature_fraction: 0.35
  # Retain low-coverage cells for mapping/QA, but refuse a release when fewer
  # than 95% of rows meet the per-row training-coverage threshold.
  min_usable_row_fraction: 0.95
  min_latitude: 9.0
  max_latitude: 29.0
  min_longitude: 92.0
  max_longitude: 102.0
