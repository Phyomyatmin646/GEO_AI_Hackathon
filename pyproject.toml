[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myanmar-agri-geo"
version = "0.1.0"
description = "Reproducible Geo-CSV builder for Myanmar crop-suitability research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Myanmar Agri Geo CSV contributors"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
full = [
  "earthengine-api>=1.0",
  "geopandas>=0.14",
  "google-api-python-client>=2.0",
  "pyarrow>=14",
  "rasterio>=1.3",
  "requests>=2.31",
  "shapely>=2.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
myanmar-agri-geo = "myanmar_agri_geo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
